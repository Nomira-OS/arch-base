# The collector "packages": every package any group names, installed as a
# collector that fans out, so that a changed package does not unpack all
# the others again:
#
# This flavour installs from the archive snapshot of the image, the same
# package set on every build; packages-live.yml from the live repositories.
#
#   resolve  pacman lists what pacman -Su --needed would download: the
#            packages the groups name, the dependencies the system does
#            not have yet, and updates of installed packages if the sync
#            database is newer than they are. Name, URL from the archive
#            snapshot of the image, sha256 from the sync database,
#            and pkgbase as the key, so that split packages share a bucket.
#            The empty cache directory makes pacman print URLs, never a
#            path in a cache. Packages the system cannot take, such as one
#            that conflicts with an installed package, stop the build
#            here (--noconfirm answers no).
#   each     unpacks the packages of one bucket into /nomira/out with
#            pacman, honouring NoExtract and keeping file capabilities. No
#            database, no install scripts and no hooks: they would run in
#            a system that holds only this bucket. The hook files of the
#            packages are therefore unpacked after pacman, with bsdtar,
#            and the hook directory of the system is hidden by a tmpfs.
#            pacman checks the packages of a bucket against each other,
#            each the bucket against the system it runs on, as pacman
#            would without --overwrite (a file there must belong to the
#            package being upgraded), and the frontend checks the
#            buckets against each other.
#   then     pacman -Su --needed with the items, from the downloaded
#            files as its package cache and with downloading forbidden
#            (XferCommand = /bin/false): a real transaction that writes no
#            file again (NoExtract = *), except where hooks need one:
#            database, install scripts and hooks are pacman's own. libalpm
#            ignores files under NoExtract for path triggers, hence a
#            negation per target of the hooks in effect. A hook without
#            NeedsTargets needs one matching path, so a target like
#            usr/share/fonts/* gets the directory usr/share/fonts/, which
#            every font package lists: no font, firmware file or module is
#            written twice. A hook with NeedsTargets gets its targets as
#            they are. The first NoExtract line is ours, so NoExtract
#            lines of the system still win. --overwrite '*' only lets
#            pacman take the files the buckets put in place; each and the
#            frontend checked them. An update is laid over its old files
#            in its bucket like a new package; NoUpgrade = * keeps pacman
#            from removing the old files it would then not unpack again,
#            and the files only the old version had are removed
#            afterwards. Install scripts and hooks see a real upgrade, and
#            install reasons are those of pacman -S.
#
#            pacman checks every package against its signature, with a
#            keyring set up in a tmpfs from archlinux-keyring, without a
#            keyserver. pacman wants a .sig file next to a cached package;
#            the signatures come from the sync database (%PGPSIG%), so
#            nothing is downloaded for them.
#
# BuildKit downloads the packages and checks them against the sha256 from
# the sync database. They are
# cached by their sha256 below /var/lib/buildkit, across reboots and base
# images. Which packages need a new initramfs is not the recipe's
# business: the hook of the image decides, as on any Arch system.
imports: [mounts.yml]
build:
  packages:
    collect:
      resolve: >-
        run mkdir -p /tmp/nocache &&
        pacman -Sup --needed --noconfirm --cachedir /tmp/nocache
        --print-format '%n %l sha256:%h %e' ${items}
      each: >-
        run --mount=type=tmpfs,target=/etc/pacman.d/hooks
        for f in /nomira/in/*.pkg.tar.*; do if [ ! -e "$f" ]; then exit 0; fi; break; done &&
        { cat /etc/pacman.conf && printf '[options]\nNoExtract = usr/share/libalpm/hooks/*\n'; } > /tmp/pacman.conf &&
        mkdir -p /tmp/db &&
        pacman --config /tmp/pacman.conf --root /nomira/out --dbpath /tmp/db --logfile /dev/null
        -U --noconfirm --nodeps --noscriptlet /nomira/in/*.pkg.tar.* &&
        for f in /nomira/in/*.pkg.tar.*; do p="${f##*/}"; p="${p%.pkg.tar*}"; p="${p%-*}";
        if grep -q '^usr/share/libalpm/hooks/.' "/tmp/db/local/$p/files"; then
        bsdtar -xpf "$f" -C /nomira/out usr/share/libalpm/hooks; fi; done &&
        cd /nomira/out && find . ! -type d | sed 's|^\./||' | while IFS= read -r f; do
        if [ -e "/$f" ] || [ -L "/$f" ]; then printf '/%s\n' "$f"; fi; done > /tmp/present &&
        if [ -s /tmp/present ]; then
        names=" $(sed -n '/^%NAME%$/{n;p;}' /tmp/db/local/*/desc | tr '\n' ' ')" &&
        xargs -d '\n' pacman -Qo < /tmp/present 2>&1 | awk -v names="$names"
        '/ is owned by / && index(names, " " $(NF-1) " ") { next } { print "conflict: " $0; bad = 1 } END { exit bad }'; fi
      then: >-
        run --mount=type=tmpfs,target=/etc/pacman.d/gnupg
        for f in /nomira/in/*.db; do if [ -f "$f" ]; then cp "$f" "$(pacman-conf DBPath)/sync/"; fi; done &&
        pacman-key --init > /dev/null && pacman-key --populate > /dev/null &&
        sed -i '/^keyserver/d' /etc/pacman.d/gnupg/gpg.conf &&
        hooks="" &&
        for f in /etc/pacman.d/hooks/*.hook; do if [ -f "$f" ]; then hooks="$hooks $f"; fi; done &&
        for f in /usr/share/libalpm/hooks/*.hook; do
        if [ -f "$f" ] && [ ! -e "/etc/pacman.d/hooks/${f##*/}" ]; then hooks="$hooks $f"; fi; done &&
        neg="$(awk '
        function section(  i) { if (path) for (i = 1; i <= m; i++) t[++n] = s[i]; m = 0; path = 0 }
        function hook(  i, x) { section(); for (i = 1; i <= n; i++) { x = t[i];
        if (!needs && x ~ /\/\*$/) x = substr(x, 1, length(x) - 1);
        if (!(x in seen)) { seen[x]; printf "!%s ", x } } n = 0; needs = 0 }
        FNR == 1 && NR > 1 { hook() }
        /^[[:space:]]*\[/ { section() }
        /^[[:space:]]*Type[[:space:]]*=[[:space:]]*(Path|File)[[:space:]]*$/ { path = 1 }
        /^[[:space:]]*NeedsTargets/ { needs = 1 }
        /^[[:space:]]*Target[[:space:]]*=/ { x = $0; sub(/^[^=]*=[[:space:]]*/, "", x);
        sub(/[[:space:]]+$/, "", x); if (x !~ /^!/) s[++m] = x }
        END { hook() }' $hooks </dev/null)" &&
        awk -v l="NoExtract = * $neg" -v u="NoUpgrade = * $neg"
        '{ print } !d && /^\[options\]/ { print l; print u; print "XferCommand = /bin/false"; d = 1 }'
        /etc/pacman.conf > /tmp/pacman.conf &&
        echo "NoExtract = * $neg" &&
        { pacman -Qqu || true; } > /tmp/up &&
        if [ -s /tmp/up ]; then xargs pacman -Qlq < /tmp/up | sort -u > /tmp/old; fi &&
        mkdir -p /tmp/cache /tmp/sync && for db in "$(pacman-conf DBPath)"/sync/*.db; do bsdtar -xf "$db" -C /tmp/sync; done &&
        for f in /nomira/in/*.pkg.tar.*; do b="${f##*/}"; p="${b%.pkg.tar*}"; p="${p%-*}";
        sed -n '/^%PGPSIG%$/{n;p;}' "/tmp/sync/$p/desc" | base64 -d > "/tmp/cache/$b.sig"; done &&
        pacman -Su --needed --noconfirm --overwrite '*' --config /tmp/pacman.conf
        --cachedir /nomira/in --cachedir /tmp/cache ${items} &&
        if [ -s /tmp/up ]; then xargs pacman -Qlq < /tmp/up | sort -u | comm -23 /tmp/old - | grep -v '/$' |
        while IFS= read -r f; do rm -f "$f"; done; fi
