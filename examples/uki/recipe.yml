# syntax=ghcr.io/nomira-os/nomira:sha-64866c7
#
# A system for a real machine: firmware, network, SSH, an editor, all
# languages, and a unified kernel image. The image carries this recipe in
# its label org.nomira.recipe; `nomira recipe export` prints it. See
# README.md for what to adapt.
#
# The phases come from recipes/ of arch-base, pinned to a commit:
# packages and services (collectors), kernel and uki (the unified kernel
# image), lint (bootc container lint), with the mounts every run gets.
imports:
  - https://raw.githubusercontent.com/Nomira-OS/arch-base/1411e93895fd5905ded7ab547e4cbfd82ffa6fa0/recipes/uki.yml
  - https://raw.githubusercontent.com/Nomira-OS/arch-base/1411e93895fd5905ded7ab547e4cbfd82ffa6fa0/recipes/lint.yml

settings:
  base: ghcr.io/nomira-os/arch-base:sha-1411e93
  # Without source_date_epoch the base image's creation time is used.
  # The image name, layer compression, secrets and the like are options
  # of the client: see nomira.conf in the nomira CLI.

build:
  # A phase that an import already has is named here to place the next
  # one: features comes after packages, and so before services, kernel
  # and uki, which build the UKI from the finished system.
  packages: {}
  features:
    hardware:
      # linux-firmware would pull in the firmware for every vendor;
      # the split packages keep the image, and every build, smaller.
      packages: [linux-firmware-intel, intel-ucode]
    network:
      packages: [networkmanager]
      services: [NetworkManager.service]
    ssh:
      packages: [openssh]
      services: [sshd.service]
    editor:
      packages: [nano]
    language:
      packages: [glibc-locales]
