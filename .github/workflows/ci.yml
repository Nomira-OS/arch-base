name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: Nomira-OS/ci/.github/workflows/checks.yml@main

  # The example recipes must stay valid for the frontend they name, and
  # the recipe parts in recipes/ for the frontend of the examples. Linting
  # goes through BuildKit, as `nomira lint` does; imports by URL are
  # fetched there.
  examples:
    runs-on: ubuntu-26.04
    env:
      # renovate: datasource=docker depName=moby/buildkit
      BUILDKIT_VERSION: v0.35.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the initramfs script
        run: sh hack/test-initramfs.sh
      - name: Start BuildKit
        run: |
          docker run -d --name buildkitd --privileged -v "$PWD:/src:ro" "moby/buildkit:${BUILDKIT_VERSION}"
          for i in $(seq 1 30); do
            docker exec buildkitd buildctl debug workers >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs buildkitd
          exit 1
      - name: Lint the example recipes and the recipe parts
        run: |
          set -eu
          lint() { # <directory below the checkout> <frontend image>
            echo "== $1/recipe.yml ($2)"
            docker exec buildkitd buildctl build \
              --frontend gateway.v0 --opt source="$2" \
              --local context="/src/$1" --local dockerfile="/src/$1" \
              --opt filename=recipe.yml --opt mode=lint \
              --output type=local,dest=/tmp/lint
          }
          for f in examples/*/recipe.yml; do
            lint "$(dirname "$f")" "$(sed -n '1s/^# syntax=//p' "$f")"
          done
          # The parts as they are in this commit, all of them imported.
          mkdir -p .lint-parts
          cp -r recipes .lint-parts/
          {
            echo "imports: [recipes/services.yml, recipes/initramfs.yml, recipes/lint.yml, recipes/uki.yml]"
            echo "settings: {base: $(sed -n 's/^  base: //p' examples/minimal/recipe.yml)}"
            echo "build: {packages: {}, features: {g: {packages: [nano]}}}"
          } > .lint-parts/recipe.yml
          lint .lint-parts "$(sed -n '1s/^# syntax=//p' examples/minimal/recipe.yml)"

  versions:
    runs-on: ubuntu-26.04
    outputs:
      build-args: ${{ steps.v.outputs.build-args }}
      snapshot-tag: ${{ steps.v.outputs.snapshot-tag }}
      sha-tag: ${{ steps.v.outputs.sha-tag }}
      source-date-epoch: ${{ steps.v.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          args="$(sh hack/build-args.sh)"
          eval "$(printf '%s\n' "$args" | grep -E '^(SNAPSHOT|SOURCE_DATE_EPOCH)=')"
          {
            echo "build-args<<EOF_ARGS"
            printf '%s\n' "$args"
            echo "EOF_ARGS"
            echo "snapshot-tag=$(echo "$SNAPSHOT" | tr / .)"
            echo "source-date-epoch=$SOURCE_DATE_EPOCH"
            echo "sha-tag=sha-$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"

  # Every commit on main is published as an immutable development build,
  # sha-<commit>. Releases are cut by hand with the release workflow. The
  # Containerfile ends with `bootc container lint`, so a build that
  # succeeds has passed it.
  image:
    needs: versions
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    uses: Nomira-OS/ci/.github/workflows/image.yml@main
    with:
      image: ghcr.io/nomira-os/arch-base
      build-args: ${{ needs.versions.outputs.build-args }}
      source-date-epoch: ${{ needs.versions.outputs.source-date-epoch }}
      # Per-package layers: an update downloads the packages that changed.
      chunk-layers: 64
      # latest follows main, for trying things out; recipes pin sha-….
      tags: |
        ${{ needs.versions.outputs.sha-tag }}
        latest
      push: ${{ github.event_name != 'pull_request' }}
