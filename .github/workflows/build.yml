name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Arch Linux Archive date (YYYY/MM/DD); empty uses versions.env"
        required: false
  schedule:
    - cron: "17 3 * * 1"   # Mondays: move to a new snapshot

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nomira-os/nomira-image

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write   # the scheduled run commits the new snapshot date
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve versions
        id: v
        env:
          INPUT_SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -eu
          . ./versions.env
          bump=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Yesterday: today's archive snapshot may still be incomplete.
            bump="$(date -u -d yesterday +%Y/%m/%d)"
          elif [ -n "${INPUT_SNAPSHOT:-}" ]; then
            bump="$INPUT_SNAPSHOT"
          fi
          if [ -n "$bump" ] && [ "$bump" != "$SNAPSHOT" ]; then
            SNAPSHOT="$bump"
            sed -i "s|^SNAPSHOT=.*|SNAPSHOT=$SNAPSHOT|" versions.env
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "snapshot=$SNAPSHOT"
            echo "tag=$(echo "$SNAPSHOT" | tr / .)"
            echo "bootc=$BOOTC_REF"
            echo "bcvk=$BCVK_REF"
            echo "cli=$NOMIRA_CLI_REF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Containerfile ends with `bootc container lint`, so a build that
      # succeeds has passed it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            SNAPSHOT=${{ steps.v.outputs.snapshot }}
            BOOTC_REF=${{ steps.v.outputs.bootc }}
            BCVK_REF=${{ steps.v.outputs.bcvk }}
            NOMIRA_CLI_REF=${{ steps.v.outputs.cli }}
          # The snapshot date is the only tag; there is deliberately no `latest`.
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only after the image for the new date was built and pushed.
      - name: Commit new snapshot date
        if: steps.v.outputs.bumped == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Snapshot ${{ steps.v.outputs.snapshot }}" versions.env
          git push
